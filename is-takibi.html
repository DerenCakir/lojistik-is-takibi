<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deren İş Akışı</title>
<style>
  :root{
    --radius:14px;
    --green:#16a34a; --amber:#d97706; --red:#dc2626; --purple:#7c3aed;
    /* Aydınlık (varsayılan) */
    --bg:#eceff5; --panel:#ffffff; --panel2:#f4f6fb; --line:#e3e8f1;
    --txt:#1e2733; --muted:#6b7688; --accent:#4f46e5; --accent2:#4338ca;
    --chip:#eef1f9; --shadow:0 10px 34px rgba(40,60,110,.10);
  }
  [data-theme="gece"]{
    --bg:#0f1623; --panel:#18202e; --panel2:#212b3b; --line:#2c3849;
    --txt:#e6ecf5; --muted:#8896a9; --accent:#818cf8; --accent2:#6366f1;
    --chip:#26313f; --shadow:0 12px 38px rgba(0,0,0,.5);
    --green:#34d399; --amber:#fbbf24; --red:#f87171; --purple:#a78bfa;
  }
  [data-theme="lavanta"]{
    --bg:#f2eefb; --panel:#ffffff; --panel2:#f7f4fe; --line:#eae3f7;
    --txt:#2a2440; --muted:#7b7397; --accent:#7c5cfc; --accent2:#6a45f0;
    --chip:#f1ecfb; --shadow:0 10px 34px rgba(90,60,160,.13);
    --purple:#8b5cf6;
  }
  [data-theme="okyanus"]{
    --bg:#e9f2f2; --panel:#ffffff; --panel2:#eff7f6; --line:#d9e8e7;
    --txt:#123138; --muted:#5d7c82; --accent:#0d9488; --accent2:#0b7d73;
    --chip:#e5f2f0; --shadow:0 10px 34px rgba(20,90,90,.13);
    --green:#059669; --purple:#7c5cfc;
  }
  [data-theme="gunbatimi"]{
    --bg:#f5ede3; --panel:#fffaf4; --panel2:#f6efe6; --line:#ecdfce;
    --txt:#33291f; --muted:#8a7863; --accent:#e0733d; --accent2:#c85f2c;
    --chip:#f2e7d8; --shadow:0 10px 34px rgba(140,90,40,.14);
    --green:#5a8f3c; --amber:#c9891e; --red:#cf4b3f; --purple:#9a6bd0;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
    background:var(--bg); color:var(--txt); font-size:15px; line-height:1.45;
  }
  button{font-family:inherit}
  input,select,textarea{
    font-family:inherit; font-size:14px; color:var(--txt);
    background:var(--panel2); border:1px solid var(--line);
    border-radius:8px; padding:9px 11px; width:100%;
  }
  textarea{resize:vertical; min-height:70px}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--accent); outline-offset:-1px; border-color:transparent}
  label{display:block; font-size:12px; color:var(--muted); margin:0 0 5px 2px; font-weight:600; letter-spacing:.02em}

  /* Layout */
  .app{display:flex; min-height:100vh}
  .side{
    width:230px; flex-shrink:0; background:var(--panel); border-right:1px solid var(--line);
    display:flex; flex-direction:column; position:sticky; top:0; height:100vh;
  }
  .brand{padding:20px 20px 14px; display:flex; align-items:center; gap:10px}
  .brand .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--purple));display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff}
  .brand h1{font-size:16px;margin:0;font-weight:700}
  .brand span{font-size:11px;color:var(--muted);display:block;font-weight:500}
  nav{padding:8px 12px; flex:1; overflow:auto}
  .navbtn{
    display:flex; align-items:center; gap:11px; width:100%; text-align:left;
    background:transparent; border:none; color:var(--muted); padding:10px 12px;
    border-radius:9px; cursor:pointer; font-size:14px; font-weight:600; margin-bottom:2px;
  }
  .navbtn .ic{width:20px;text-align:center;font-size:16px}
  .navbtn:hover{background:var(--panel2); color:var(--txt)}
  .navbtn.active{background:var(--accent); color:#fff}
  .navbtn .badge{margin-left:auto;background:var(--chip);color:var(--muted);font-size:11px;font-weight:700;padding:1px 8px;border-radius:20px}
  .navbtn.active .badge{background:rgba(255,255,255,.25);color:#fff}
  .side-foot{padding:12px; border-top:1px solid var(--line); display:flex; flex-direction:column; gap:8px}

  .main{flex:1; min-width:0; display:flex; flex-direction:column}
  .stickytop{position:sticky; top:0; z-index:8; background:var(--bg)}
  .topbar{
    display:flex; align-items:center; gap:14px; padding:16px 26px;
    border-bottom:1px solid var(--line); background:var(--panel); flex-wrap:wrap;
  }
  /* Mesai kronometresi çubuğu */
  .timerbar{border-bottom:1px solid var(--line); background:var(--panel); padding:11px 26px}
  .timerbar.on{background:linear-gradient(90deg,rgba(63,184,113,.10),transparent)}
  .tb-idle{display:flex; align-items:center; gap:14px}
  .tb-idle .btn{margin-left:auto}
  .tb-run{display:flex; align-items:center; gap:16px; flex-wrap:wrap}
  .tb-main{display:flex; flex-direction:column; line-height:1.05}
  .tb-label{font-size:11px; letter-spacing:.16em; color:var(--muted); font-weight:800}
  .tb-clock{font-size:27px; font-weight:800; font-variant-numeric:tabular-nums}
  .tb-seg{display:flex; flex-direction:column; line-height:1.05; padding-left:16px; border-left:1px solid var(--line)}
  .tb-segclock{font-size:20px; font-weight:700; font-variant-numeric:tabular-nums; color:var(--accent)}
  .tb-run .live{width:10px; height:10px; border-radius:50%; background:var(--green); flex-shrink:0; animation:pulse 1.6s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(63,184,113,.5)}70%{box-shadow:0 0 0 9px rgba(63,184,113,0)}100%{box-shadow:0 0 0 0 rgba(63,184,113,0)}}
  .btn.danger{border-color:var(--red); color:var(--red)}
  .btn.danger:hover{background:var(--red); color:#fff; border-color:var(--red)}
  .topbar h2{margin:0; font-size:19px}
  .topbar .sub{color:var(--muted); font-size:13px}
  .spacer{flex:1}
  .content{padding:24px 26px 60px; max-width:1100px; width:100%}

  /* Buttons */
  .btn{
    background:var(--panel2); color:var(--txt); border:1px solid var(--line);
    padding:9px 14px; border-radius:9px; cursor:pointer; font-weight:600; font-size:14px;
    display:inline-flex; align-items:center; gap:7px;
  }
  .btn:hover{border-color:var(--accent)}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:#fff}
  .btn.primary:hover{background:var(--accent2)}
  .btn.ghost{background:transparent}
  .btn.sm{padding:6px 10px; font-size:13px}
  .btn.danger:hover{border-color:var(--red); color:var(--red)}
  .iconbtn{background:transparent;border:none;color:var(--muted);cursor:pointer;font-size:15px;padding:5px 7px;border-radius:7px}
  .iconbtn:hover{background:var(--panel2);color:var(--txt)}

  /* Cards */
  .card{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:18px 20px; margin-bottom:16px}
  .card h3{margin:0 0 14px; font-size:15px; display:flex; align-items:center; gap:8px}
  .grid{display:grid; gap:14px}
  .g2{grid-template-columns:1fr 1fr}
  .g3{grid-template-columns:repeat(3,1fr)}
  .row{display:flex; gap:12px; flex-wrap:wrap}
  .row > *{flex:1; min-width:140px}
  @media(max-width:720px){.g2,.g3{grid-template-columns:1fr}}

  /* Stat tiles */
  .stats{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:18px}
  @media(max-width:820px){.stats{grid-template-columns:1fr 1fr}}
  .stat{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px}
  .stat .k{font-size:12px; color:var(--muted); font-weight:600}
  .stat .v{font-size:26px; font-weight:800; margin-top:4px}
  .stat .v small{font-size:14px;color:var(--muted);font-weight:600}

  /* List items */
  .item{background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:13px 15px; margin-bottom:10px}
  .item .top{display:flex; align-items:flex-start; gap:10px}
  .item .title{font-weight:700; font-size:15px}
  .item .meta{font-size:12px; color:var(--muted); margin-top:2px; display:flex; gap:12px; flex-wrap:wrap}
  .item .body{margin-top:8px; white-space:pre-wrap; font-size:14px; color:var(--txt)}
  .item .acts{margin-left:auto; display:flex; gap:2px; flex-shrink:0}

  .chip{display:inline-flex;align-items:center;gap:5px;background:var(--chip);color:var(--muted);font-size:12px;font-weight:600;padding:3px 10px;border-radius:20px}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex-shrink:0}
  .tag{display:inline-block;background:var(--chip);border-radius:6px;padding:2px 8px;font-size:12px;color:var(--muted);margin:2px 4px 2px 0}

  .empty{text-align:center; padding:40px 20px; color:var(--muted)}
  .empty .big{font-size:40px; opacity:.5; margin-bottom:8px}

  .toolbar{display:flex; gap:10px; align-items:center; margin-bottom:16px; flex-wrap:wrap}
  .toolbar input,.toolbar select{width:auto}
  .search{min-width:200px}

  /* Modal */
  .overlay{position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; align-items:flex-start; justify-content:center; padding:40px 16px; z-index:50; overflow:auto}
  .overlay.on{display:flex}
  .modal{background:var(--panel); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow); width:100%; max-width:560px; margin:auto}
  .modal .mhead{display:flex;align-items:center;padding:18px 22px;border-bottom:1px solid var(--line)}
  .modal .mhead h3{margin:0;font-size:17px}
  .modal .mbody{padding:20px 22px; display:flex; flex-direction:column; gap:14px}
  .modal .mfoot{padding:16px 22px; border-top:1px solid var(--line); display:flex; gap:10px; justify-content:flex-end}

  .status-pill{font-size:12px;font-weight:700;padding:2px 10px;border-radius:20px}
  .st-open{background:rgba(224,167,64,.18);color:var(--amber)}
  .st-doing{background:rgba(79,140,255,.18);color:var(--accent)}
  .st-done{background:rgba(63,184,113,.18);color:var(--green)}
  .done-line{text-decoration:line-through; opacity:.6}

  .persist-ok{color:var(--green)}
  .persist-warn{color:var(--amber)}
  .mini{font-size:12px;color:var(--muted)}
  .divider{height:1px;background:var(--line);margin:6px 0}
  .checkline{display:flex;align-items:center;gap:9px;padding:6px 0}
  .checkline input[type=checkbox]{width:auto;margin:0}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);padding:11px 18px;border-radius:10px;font-size:14px;font-weight:600;z-index:99;opacity:0;transition:.25s;pointer-events:none}
  .toast.on{opacity:1;bottom:32px}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
</style>
</head>
<body>
<div class="app">
  <!-- Sidebar -->
  <aside class="side">
    <div class="brand">
      <div class="logo">D</div>
      <div><h1>Deren İş Akışı</h1><span>Kişisel iş akışı portalı</span></div>
    </div>
    <nav id="nav">
      <button class="navbtn active" data-view="bugun"><span class="ic">🏠</span> Bugün</button>
      <button class="navbtn" data-view="zaman"><span class="ic">⏱️</span> Zaman Takibi <span class="badge" id="b-zaman">0</span></button>
      <button class="navbtn" data-view="proje"><span class="ic">📁</span> Projeler <span class="badge" id="b-proje">0</span></button>
      <button class="navbtn" data-view="toplanti"><span class="ic">👥</span> Toplantılar <span class="badge" id="b-toplanti">0</span></button>
      <button class="navbtn" data-view="plansiz"><span class="ic">⚡</span> Plansız İşler <span class="badge" id="b-plansiz">0</span></button>
      <button class="navbtn" data-view="fikir"><span class="ic">💡</span> Fikirler <span class="badge" id="b-fikir">0</span></button>
      <button class="navbtn" data-view="not"><span class="ic">📝</span> Notlar <span class="badge" id="b-not">0</span></button>
      <button class="navbtn" data-view="gecmis"><span class="ic">🔍</span> Retrospektif</button>
    </nav>
    <div class="side-foot">
      <div class="mini" id="persistState">Yedek dosyası: <span class="persist-warn">bağlı değil</span></div>
      <button class="btn sm" id="btnConnect">🔗 Veri dosyası bağla</button>
      <div class="row" style="gap:6px">
        <button class="btn sm ghost" id="btnExport" style="min-width:0">⬇ Yedek</button>
        <button class="btn sm ghost" id="btnImport" style="min-width:0">⬆ Yükle</button>
        <button class="btn sm ghost" id="btnTheme" title="Temayı değiştir" style="min-width:0;flex:0">🎨</button>
      </div>
      <input type="file" id="fileInput" accept="application/json" style="display:none">
    </div>
  </aside>

  <!-- Main -->
  <main class="main">
    <div class="stickytop">
    <div class="topbar">
      <div>
        <h2 id="viewTitle">Bugün</h2>
        <div class="sub" id="viewDate"></div>
      </div>
      <div class="spacer"></div>
      <button class="btn primary" id="addBtn">+ Ekle</button>
    </div>
    <div class="timerbar" id="timerBar"></div>
    </div>
    <div class="content" id="content"></div>
  </main>
</div>

<!-- Modal -->
<div class="overlay" id="overlay">
  <div class="modal">
    <div class="mhead"><h3 id="modalTitle">Ekle</h3></div>
    <div class="mbody" id="modalBody"></div>
    <div class="mfoot">
      <button class="btn ghost" id="modalCancel">İptal</button>
      <button class="btn primary" id="modalSave">Kaydet</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============ VERİ KATMANI ============ */
const STORE_KEY = "istakibi_v1";
const DEFAULT = {timeEntries:[], meetings:[], unplanned:[], notes:[], projects:[], ideas:[]};
let data = load();
let timer = loadTimer();  // mesai kronometresi durumu
let fileHandle = null;   // File System Access API handle
let saveTimer = null;

function load(){
  try{ const raw = localStorage.getItem(STORE_KEY); if(raw){ return Object.assign({}, DEFAULT, JSON.parse(raw)); } }
  catch(e){}
  return JSON.parse(JSON.stringify(DEFAULT));
}
function save(){
  localStorage.setItem(STORE_KEY, JSON.stringify(data));
  // dosyaya da yaz (varsa)
  if(fileHandle){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(writeFile, 400);
  }
  renderBadges();
}
async function writeFile(){
  try{
    const w = await fileHandle.createWritable();
    await w.write(JSON.stringify(data, null, 2));
    await w.close();
    setPersist(true);
  }catch(e){ setPersist(false, "yazılamadı"); }
}
const uid = ()=> Date.now().toString(36) + Math.random().toString(36).slice(2,7);

/* ============ File System Access (kalıcı dosya) ============ */
const supportsFS = ('showSaveFilePicker' in window);

// IndexedDB'de handle sakla
function idbSet(h){
  return new Promise(res=>{
    const r = indexedDB.open("istakibi_fs",1);
    r.onupgradeneeded = ()=> r.result.createObjectStore("h");
    r.onsuccess = ()=>{ const tx=r.result.transaction("h","readwrite"); tx.objectStore("h").put(h,"file"); tx.oncomplete=()=>res(); };
    r.onerror = ()=>res();
  });
}
function idbGet(){
  return new Promise(res=>{
    const r = indexedDB.open("istakibi_fs",1);
    r.onupgradeneeded = ()=> r.result.createObjectStore("h");
    r.onsuccess = ()=>{ try{ const tx=r.result.transaction("h","readonly"); const g=tx.objectStore("h").get("file"); g.onsuccess=()=>res(g.result||null); g.onerror=()=>res(null);}catch(e){res(null)} };
    r.onerror = ()=>res(null);
  });
}

async function connectFile(){
  if(!supportsFS){
    alert("Bu tarayıcı otomatik dosya kaydını desteklemiyor.\nChrome veya Edge kullanın. Yine de 'Yedek indir' ile elle yedek alabilirsiniz.");
    return;
  }
  try{
    fileHandle = await window.showSaveFilePicker({
      suggestedName:"deren-is-akisi-veriler.json",
      types:[{description:"Veri dosyası", accept:{"application/json":[".json"]}}]
    });
    await idbSet(fileHandle);
    await writeFile();
    setPersist(true);
    toast("Veri dosyası bağlandı ✔ Artık her değişiklik diske de kaydediliyor.");
  }catch(e){ /* iptal */ }
}

async function tryReconnect(){
  if(!supportsFS) { setPersist(false); return; }
  const h = await idbGet();
  if(!h){ setPersist(false); return; }
  try{
    const perm = await h.queryPermission({mode:"readwrite"});
    if(perm === "granted"){ fileHandle = h; setPersist(true); return; }
    // izin tekrar istenmeli — kullanıcı butona basınca
    fileHandle = h;
    setPersist(false, "izin bekliyor");
  }catch(e){ setPersist(false); }
}

async function ensurePermission(){
  if(fileHandle && fileHandle.requestPermission){
    const p = await fileHandle.requestPermission({mode:"readwrite"});
    if(p==="granted"){ setPersist(true); await writeFile(); return true; }
  }
  return false;
}

function setPersist(ok, msg){
  const el = document.getElementById("persistState");
  if(ok){ el.innerHTML = 'Yedek dosyası: <span class="persist-ok">✔ bağlı, oto-kayıt</span>'; }
  else { el.innerHTML = 'Yedek dosyası: <span class="persist-warn">'+(msg||"bağlı değil")+'</span>'; }
}

/* ============ Yardımcılar ============ */
const $ = s=>document.querySelector(s);
const pad = n=> String(n).padStart(2,"0");
function todayStr(){ const d=new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function nowTime(){ const d=new Date(); return pad(d.getHours())+":"+pad(d.getMinutes()); }
function fmtDate(s){ if(!s) return ""; const [y,m,d]=s.split("-"); const months=["Oca","Şub","Mar","Nis","May","Haz","Tem","Ağu","Eyl","Eki","Kas","Ara"]; return d+" "+months[+m-1]+" "+y; }
function dayName(s){ const d=new Date(s+"T00:00"); return ["Pazar","Pazartesi","Salı","Çarşamba","Perşembe","Cuma","Cumartesi"][d.getDay()]; }
function minutesBetween(a,b){ if(!a||!b) return 0; const [ah,am]=a.split(":").map(Number),[bh,bm]=b.split(":").map(Number); let m=(bh*60+bm)-(ah*60+am); if(m<0)m+=1440; return m; }
function fmtDur(m){ if(!m) return "—"; const h=Math.floor(m/60), mm=m%60; return (h?h+"s ":"")+(mm?mm+"dk":(h?"":"0dk")); }
function esc(s){ return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("on"); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("on"),2600); }

const CATS = [
  {id:"derin",  name:"Derin çalışma", color:"#4f8cff"},
  {id:"toplanti",name:"Toplantı",     color:"#a76ce0"},
  {id:"mail",   name:"Mail/İletişim", color:"#3fb871"},
  {id:"plansiz",name:"Plansız iş",    color:"#e0a740"},
  {id:"idari",  name:"İdari/Rutin",   color:"#8a97a8"},
  {id:"mola",   name:"Mola/Diğer",    color:"#e5636b"},
];
const catOf = id => CATS.find(c=>c.id===id) || CATS[4];

const STAGES = [
  {id:"taslak",     name:"Taslak/Fikir",  color:"#8a97a8"},
  {id:"planlama",   name:"Planlama",      color:"#4f8cff"},
  {id:"devam",      name:"Devam ediyor",  color:"#a76ce0"},
  {id:"beklemede",  name:"Beklemede",     color:"#e0a740"},
  {id:"test",       name:"Test/İnceleme", color:"#2d9cdb"},
  {id:"tamamlandi", name:"Tamamlandı",    color:"#3fb871"},
];
const stageOf = id => STAGES.find(s=>s.id===id) || STAGES[0];
const PRIOS = {yuksek:{name:"Yüksek",color:"#e5636b"},orta:{name:"Orta",color:"#e0a740"},dusuk:{name:"Düşük",color:"#8a97a8"}};
const prioOf = id => PRIOS[id] || PRIOS.orta;
const IDEA_ST = {yeni:{name:"Yeni",cls:"st-open"},degerlendir:{name:"Değerlendiriliyor",cls:"st-doing"},uygula:{name:"Uygulanacak",cls:"st-done"},arsiv:{name:"Arşiv",cls:""}};

/* ============ MESAİ KRONOMETRESİ ============ */
function loadTimer(){ try{ const r=localStorage.getItem("istakibi_timer"); if(r) return JSON.parse(r);}catch(e){} return {workStart:null,segmentStart:null,running:false}; }
function saveTimerState(){ localStorage.setItem("istakibi_timer", JSON.stringify(timer)); }
function hhmm(d){ return pad(d.getHours())+":"+pad(d.getMinutes()); }
function fmtClock(ms){ return hhmm(new Date(ms)); }
function fmtHMS(ms){ let s=Math.max(0,Math.floor(ms/1000)); const h=Math.floor(s/3600); s%=3600; const m=Math.floor(s/60); s%=60; return pad(h)+":"+pad(m)+":"+pad(s); }

let tickTimer=null;
function tick(){
  if(!timer.running) return;
  const now=Date.now();
  const c=document.getElementById("tbClock"); if(c) c.textContent=fmtHMS(now-timer.workStart);
  const s=document.getElementById("tbSeg"); if(s) s.textContent=fmtHMS(now-timer.segmentStart);
}
function startTick(){ stopTick(); tickTimer=setInterval(tick,1000); }
function stopTick(){ if(tickTimer){clearInterval(tickTimer); tickTimer=null;} }

function updateTimerBar(){
  const bar=document.getElementById("timerBar");
  if(!bar) return;
  if(!timer.running){
    bar.className="timerbar";
    bar.innerHTML=`<div class="tb-idle">
      <div><b>🕐 Mesai kronometresi</b><div class="mini">Sabah çalışmaya başlarken kronometreyi başlatın; gün sonunda bitirin.</div></div>
      <button class="btn primary" onclick="startWork()">▶ Çalışmaya Başla</button></div>`;
    return;
  }
  bar.className="timerbar on";
  bar.innerHTML=`<div class="tb-run">
    <span class="live"></span>
    <div class="tb-main"><span class="tb-label">MESAİ · ${fmtClock(timer.workStart)}'den beri</span><span class="tb-clock" id="tbClock">00:00:00</span></div>
    <div class="tb-seg"><span class="mini">Bu işte geçen</span><span class="tb-segclock" id="tbSeg">00:00:00</span></div>
    <div style="flex:1"></div>
    <button class="btn primary" onclick="saveSegment()">✓ Bu işi kaydet</button>
    <button class="btn danger" onclick="endWork()">⏹ Mesaiyi Bitir</button></div>`;
  tick();
}
function startWork(){
  const now=Date.now();
  timer={workStart:now, segmentStart:now, running:true};
  saveTimerState(); startTick(); updateTimerBar();
  toast("Mesai başladı. Kolay gelsin! 💪");
}
const saveSegment=()=>openSegmentModal(false);
function openSegmentModal(isEnd){
  if(!timer.running) return;
  const now=Date.now();
  editing={type:"segment", isEnd:!!isEnd, start:timer.segmentStart, end:now};
  const mins=Math.round((now-timer.segmentStart)/60000);
  const opts=CATS.map(c=>`<option value="${c.id}">${c.name}</option>`).join("");
  document.getElementById("modalTitle").textContent="Bu işi kaydet";
  document.getElementById("modalBody").innerHTML=`
    <div class="item" style="margin:0">⏱️ <b>${fmtClock(timer.segmentStart)} – ${fmtClock(now)}</b> arası çalıştınız
      <span class="chip" style="margin-left:6px;color:var(--accent)">${fmtDur(mins)||"0dk"}</span>
      <div class="mini" style="margin-top:6px">Kaydettiğinizde bir sonraki iş için sayaç sıfırdan başlar.</div></div>
    <div><label>Bu süre boyunca ne çalıştınız? *</label><input id="f_activity" placeholder="Örn: Rapor hazırlığı"></div>
    <div><label>Kategori</label><select id="f_category">${opts}</select></div>
    <div><label>Not (opsiyonel)</label><textarea id="f_note" placeholder="Detay..."></textarea></div>`;
  document.getElementById("overlay").classList.add("on");
  setTimeout(()=>{const el=document.getElementById("f_activity"); if(el) el.focus();},50);
}
function endWork(){
  if(!timer.running) return;
  const mins=Math.round((Date.now()-timer.segmentStart)/60000);
  if(mins>=1){
    if(confirm(`Mesai bitiyor. Son çalıştığınız ${fmtDur(mins)}'lik dilimi de kaydedelim mi?\n\nTamam = kaydet ve bitir · İptal = kaydetmeden bitir`)){
      openSegmentModal(true); return;
    }
  }
  finishWorkFinal();
}
function finishWorkFinal(){
  const total = timer.workStart ? fmtHMS(Date.now()-timer.workStart) : "";
  timer={workStart:null,segmentStart:null,running:false};
  saveTimerState(); stopTick(); updateTimerBar();
  toast("Mesai bitti"+(total?` · toplam ${total}`:"")+". İyi günler! 👋");
}

/* ============ NAVİGASYON ============ */
let view = "bugun";
const TITLES = {bugun:"Bugün", zaman:"Zaman Takibi", proje:"Projeler", toplanti:"Toplantılar", plansiz:"Plansız İşler", fikir:"Fikirler", not:"Notlar", gecmis:"Retrospektif"};
document.querySelectorAll(".navbtn").forEach(b=>{
  b.onclick = ()=>{
    document.querySelectorAll(".navbtn").forEach(x=>x.classList.remove("active"));
    b.classList.add("active");
    view = b.dataset.view;
    render();
  };
});

function render(){
  $("#viewTitle").textContent = TITLES[view];
  const d = new Date();
  $("#viewDate").textContent = dayName(todayStr())+", "+fmtDate(todayStr());
  $("#addBtn").style.display = (view==="bugun"||view==="gecmis") ? "none" : "inline-flex";
  const c = $("#content");
  if(view==="bugun") c.innerHTML = renderBugun();
  else if(view==="zaman") renderZaman(c);
  else if(view==="proje") renderProje(c);
  else if(view==="toplanti") renderToplanti(c);
  else if(view==="plansiz") renderPlansiz(c);
  else if(view==="fikir") renderFikir(c);
  else if(view==="not") renderNot(c);
  else if(view==="gecmis") renderGecmis(c);
  renderBadges();
}
function renderBadges(){
  $("#b-zaman").textContent = data.timeEntries.filter(e=>e.date===todayStr()).length;
  $("#b-proje").textContent = data.projects.filter(p=>p.stage!=="tamamlandi").length;
  $("#b-toplanti").textContent = data.meetings.length;

}

/* ============ BUGÜN (özet) ============ */
function renderBugun(){
  const t = todayStr();
  const te = data.timeEntries.filter(e=>e.date===t);
  const totalMin = te.reduce((s,e)=>s+minutesBetween(e.start,e.end),0);
  const mt = data.meetings.filter(m=>m.date===t);
  const up = data.unplanned.filter(u=>u.date===t);
  const upOpen = data.unplanned.filter(u=>u.status!=="done").length;

  // kategori dağılımı
  const byCat = {};
  te.forEach(e=>{ byCat[e.category]=(byCat[e.category]||0)+minutesBetween(e.start,e.end); });
  let bars = Object.entries(byCat).sort((a,b)=>b[1]-a[1]).map(([cid,m])=>{
    const cc=catOf(cid); const pct = totalMin? Math.round(m/totalMin*100):0;
    return `<div style="margin-bottom:9px">
      <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:3px">
        <span><span class="dot" style="background:${cc.color}"></span> ${cc.name}</span>
        <span class="mini">${fmtDur(m)} · %${pct}</span></div>
      <div style="height:8px;background:var(--chip);border-radius:6px;overflow:hidden">
        <div style="height:100%;width:${pct}%;background:${cc.color}"></div></div></div>`;
  }).join("") || `<div class="mini">Bugün için henüz zaman kaydı yok.</div>`;

  const stats = `<div class="stats">
    <div class="stat"><div class="k">Kayıtlı süre (bugün)</div><div class="v">${fmtDur(totalMin)||"0dk"}</div></div>
    <div class="stat"><div class="k">Zaman kaydı</div><div class="v">${te.length}</div></div>
    <div class="stat"><div class="k">Toplantı (bugün)</div><div class="v">${mt.length}</div></div>
    <div class="stat"><div class="k">Açık plansız iş</div><div class="v">${upOpen}</div></div>
  </div>`;

  const teList = te.length ? te.sort((a,b)=>(a.start||"").localeCompare(b.start||"")).map(e=>{
    const cc=catOf(e.category);
    return `<div class="checkline" style="border-bottom:1px solid var(--line)">
      <span class="dot" style="background:${cc.color}"></span>
      <b style="min-width:105px">${e.start||"--"} – ${e.end||"--"}</b>
      <span>${esc(e.activity)}</span>
      <span class="mini" style="margin-left:auto">${fmtDur(minutesBetween(e.start,e.end))}</span></div>`;
  }).join("") : `<div class="mini">Kayıt yok. "Zaman Takibi" bölümünden ekleyebilirsiniz.</div>`;

  const mtList = mt.length ? mt.map(m=>`<div class="checkline"><span class="dot" style="background:var(--purple)"></span> <b>${m.time||""}</b> ${esc(m.title)}</div>`).join("")
    : `<div class="mini">Bugün toplantı yok.</div>`;

  const upList = up.length ? up.map(u=>`<div class="checkline"><span class="status-pill ${u.status==='done'?'st-done':u.status==='doing'?'st-doing':'st-open'}">${statusLbl(u.status)}</span> <span class="${u.status==='done'?'done-line':''}">${esc(u.text)}</span></div>`).join("")
    : `<div class="mini">Bugün plansız iş kaydı yok.</div>`;

  const actProj = data.projects.filter(p=>p.stage!=="tamamlandi")
    .sort((a,b)=>STAGES.findIndex(s=>s.id===a.stage)-STAGES.findIndex(s=>s.id===b.stage));
  const projList = actProj.length ? actProj.slice(0,6).map(p=>{
    const st=stageOf(p.stage), prog=projProgress(p);
    return `<div style="margin-bottom:11px">
      <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px">
        <span><span class="dot" style="background:${st.color}"></span> ${esc(p.name)}</span>
        <span class="mini">${st.name} · %${prog}</span></div>
      <div style="height:7px;background:var(--chip);border-radius:6px;overflow:hidden"><div style="height:100%;width:${prog}%;background:${st.color}"></div></div></div>`;
  }).join("") : `<div class="mini">Aktif proje yok. "Projeler" bölümünden ekleyebilirsiniz.</div>`;

  return stats + `
    <div class="card"><h3>📁 Aktif projeler${actProj.length>6?` <span class="mini">(ilk 6 / ${actProj.length})</span>`:""}</h3>${projList}</div>`+`
    <div class="grid g2">
      <div class="card"><h3>⏱️ Bugünün zaman dağılımı</h3>${bars}</div>
      <div class="card"><h3>📋 Bugünün akışı</h3>${teList}</div>
    </div>
    <div class="grid g2">
      <div class="card"><h3>👥 Bugünkü toplantılar</h3>${mtList}</div>
      <div class="card"><h3>⚡ Bugünkü plansız işler</h3>${upList}</div>
    </div>
    <div class="card" style="background:var(--panel2)">
      <h3>💡 Hızlı ekle</h3>
      <div class="row">
        <button class="btn" onclick="quick('zaman')">⏱️ Zaman kaydı</button>
        <button class="btn" onclick="quick('proje')">📁 Proje</button>
        <button class="btn" onclick="quick('toplanti')">👥 Toplantı</button>
        <button class="btn" onclick="quick('plansiz')">⚡ Plansız iş</button>
        <button class="btn" onclick="quick('fikir')">💡 Fikir</button>
        <button class="btn" onclick="quick('not')">📝 Not</button>
      </div>
    </div>`;
}
function quick(v){ document.querySelector(`.navbtn[data-view="${v}"]`).click(); setTimeout(()=>openModal(v),80); }
function statusLbl(s){ return s==="done"?"Bitti":s==="doing"?"Devam":"Açık"; }

/* ============ PROJELER (aşama takibi) ============ */
let prF="active";
function projProgress(p){
  const ph=p.phases||[];
  if(ph.length) return Math.round(ph.filter(a=>a.done).length/ph.length*100);
  const idx=STAGES.findIndex(s=>s.id===p.stage);
  return Math.round(idx/(STAGES.length-1)*100);
}
function renderProje(c){
  c.innerHTML=`<div class="toolbar">
    <select id="prF" style="width:auto">
      <option value="active">Aktif projeler</option>
      <option value="all">Tümü</option>
      ${STAGES.map(s=>`<option value="st:${s.id}">${s.name}</option>`).join("")}
    </select>
    <select id="prSort" style="width:auto">
      <option value="stage">Sırala: aşama</option>
      <option value="prio">Sırala: öncelik</option>
      <option value="due">Sırala: hedef tarih</option>
    </select>
    <input class="search" id="prSearch" placeholder="🔍 Proje ara...">
  </div><div id="prList"></div>`;
  $("#prF").value=prF;
  const draw=()=>{
    const q=($("#prSearch").value||"").toLowerCase();
    const sort=$("#prSort").value;
    let f=[...data.projects];
    if(prF==="active") f=f.filter(p=>p.stage!=="tamamlandi");
    else if(prF.startsWith("st:")) f=f.filter(p=>p.stage===prF.slice(3));
    if(q) f=f.filter(p=>(p.name+(p.desc||"")+(p.notes||"")).toLowerCase().includes(q));
    const prioRank={yuksek:0,orta:1,dusuk:2};
    if(sort==="stage") f.sort((a,b)=>STAGES.findIndex(s=>s.id===a.stage)-STAGES.findIndex(s=>s.id===b.stage) || (prioRank[a.priority]-prioRank[b.priority]));
    else if(sort==="prio") f.sort((a,b)=>(prioRank[a.priority]??1)-(prioRank[b.priority]??1));
    else if(sort==="due") f.sort((a,b)=>(a.dueDate||"9999").localeCompare(b.dueDate||"9999"));
    const L=$("#prList");
    if(!f.length){ L.innerHTML=emptyBox("📁","Proje yok","Hangi projede hangi aşamada olduğunuzu takip etmek için “+ Ekle”."); return; }
    L.innerHTML=f.map(p=>{
      const st=stageOf(p.stage), idx=STAGES.findIndex(s=>s.id===p.stage), pr=prioOf(p.priority);
      const prog=projProgress(p);
      const phases=p.phases||[]; const donePh=phases.filter(a=>a.done).length;
      const stepper=STAGES.map((s,i)=>`<div title="${s.name}" style="flex:1;height:6px;border-radius:4px;background:${i<=idx?s.color:'var(--chip)'}"></div>`).join("");
      const phaseHtml = phases.length? `<div class="divider"></div><div class="mini" style="margin-bottom:6px">Adımlar (${donePh}/${phases.length})</div>`+
        phases.map((a,i)=>`<div class="checkline"><input type="checkbox" ${a.done?"checked":""} onchange="togglePhase('${p.id}',${i})"><span class="${a.done?'done-line':''}">${esc(a.text)}</span></div>`).join("") : "";
      const overdue = p.dueDate && p.dueDate<todayStr() && p.stage!=="tamamlandi";
      return `<div class="item"><div class="top">
        <span class="dot" style="background:${st.color};margin-top:6px"></span>
        <div style="flex:1">
          <div class="title">${esc(p.name)}</div>
          <div class="meta">
            <span class="status-pill" style="background:${st.color}22;color:${st.color}">${st.name}</span>
            <span class="chip" style="color:${pr.color}"><span class="dot" style="background:${pr.color}"></span>${pr.name} öncelik</span>
            ${p.startDate?`<span>▶ ${fmtDate(p.startDate)}</span>`:""}
            ${p.dueDate?`<span style="${overdue?'color:var(--red);font-weight:700':''}">🎯 ${fmtDate(p.dueDate)}${overdue?' (gecikti)':''}</span>`:""}
          </div>
          <div style="display:flex;align-items:center;gap:10px;margin:9px 0 2px">

function togglePhase(pid,i){ const p=data.projects.find(x=>x.id===pid); if(p){ p.phases[i].done=!p.phases[i].done; save(); render(); } }
function advanceStage(pid){
  const p=data.projects.find(x=>x.id===pid); if(!p) return;
  const idx=STAGES.findIndex(s=>s.id===p.stage);
  if(idx<STAGES.length-1){ p.stage=STAGES[idx+1].id; save(); render(); toast("Aşama: "+stageOf(p.stage).name); }
}

/* ============ RETROSPEKTİF / GEÇMİŞ ============ */
function renderGecmis(c){
  const t=todayStr();
  const d=new Date(); d.setDate(d.getDate()-7);
  const weekAgo=d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
  c.innerHTML=`
    <div class="card">
      <h3>🔍 Geçmişe dönük kontrol</h3>
      <div class="row">
        <div><label>Başlangıç</label><input type="date" id="gFrom" value="${weekAgo}"></div>
        <div><label>Bitiş</label><input type="date" id="gTo" value="${t}"></div>
        <div><label>&nbsp;</label><button class="btn primary" id="gRun" style="width:100%">Getir</button></div>
      </div>
      <div class="row" style="margin-top:10px">
        <button class="btn sm ghost" data-range="today">Bugün</button>
        <button class="btn sm ghost" data-range="week">Son 7 gün</button>
        <button class="btn sm ghost" data-range="month">Son 30 gün</button>
      </div>
    </div>
    <div id="gResult"></div>`;
  const run=()=>gecmisResult($("#gFrom").value,$("#gTo").value);
  $("#gRun").onclick=run;
  c.querySelectorAll("[data-range]").forEach(b=>b.onclick=()=>{
    const dd=new Date(); let from=t;
    if(b.dataset.range==="week"){dd.setDate(dd.getDate()-7);}
    else if(b.dataset.range==="month"){dd.setDate(dd.getDate()-30);}
    from=b.dataset.range==="today"?t:dd.getFullYear()+"-"+pad(dd.getMonth()+1)+"-"+pad(dd.getDate());
    $("#gFrom").value=from; $("#gTo").value=t; run();
  });
  run();
}
function inRange(dt,f,to){ return dt>=f && dt<=to; }
function gecmisResult(f,to){
  const R=$("#gResult");
  if(f>to){ R.innerHTML=`<div class="card"><div class="mini">Başlangıç tarihi bitişten sonra olamaz.</div></div>`; return; }
  const te=data.timeEntries.filter(e=>inRange(e.date,f,to));
  const mt=data.meetings.filter(m=>inRange(m.date,f,to));
  const up=data.unplanned.filter(u=>inRange(u.date,f,to));
  const nt=data.notes.filter(n=>inRange(n.date,f,to));
  const totalMin=te.reduce((s,e)=>s+minutesBetween(e.start,e.end),0);

  const byCat={}; te.forEach(e=>byCat[e.category]=(byCat[e.category]||0)+minutesBetween(e.start,e.end));
  const bars=Object.entries(byCat).sort((a,b)=>b[1]-a[1]).map(([cid,m])=>{
    const cc=catOf(cid),pct=totalMin?Math.round(m/totalMin*100):0;
    return `<div style="margin-bottom:8px"><div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:3px"><span><span class="dot" style="background:${cc.color}"></span> ${cc.name}</span><span class="mini">${fmtDur(m)} · %${pct}</span></div><div style="height:8px;background:var(--chip);border-radius:6px"><div style="height:100%;width:${pct}%;background:${cc.color};border-radius:6px"></div></div></div>`;
  }).join("")||`<div class="mini">Bu aralıkta zaman kaydı yok.</div>`;

  // güne göre grupla
  const days={};
  [...te.map(x=>({...x,_t:"zaman"})),...mt.map(x=>({...x,_t:"toplanti"})),...up.map(x=>({...x,_t:"plansiz"})),...nt.map(x=>({...x,_t:"not"}))]
    .forEach(x=>{ (days[x.date]=days[x.date]||[]).push(x); });
  const dayHtml=Object.keys(days).sort((a,b)=>b.localeCompare(a)).map(d=>{
    const rows=days[d].map(x=>{
      if(x._t==="zaman"){const cc=catOf(x.category);return `<div class="checkline"><span class="dot" style="background:${cc.color}"></span><b>⏱️ ${x.start||"--"}–${x.end||"--"}</b> ${esc(x.activity)} <span class="mini">(${fmtDur(minutesBetween(x.start,x.end))})</span></div>`;}
      if(x._t==="toplanti")return `<div class="checkline"><span class="dot" style="background:var(--purple)"></span><b>👥 Toplantı:</b> ${esc(x.title)}${x.purpose?` <span class="mini">— ${esc(x.purpose)}</span>`:""}</div>`;
      if(x._t==="plansiz")return `<div class="checkline"><span class="status-pill ${x.status==='done'?'st-done':x.status==='doing'?'st-doing':'st-open'}">${statusLbl(x.status)}</span> <span>⚡ ${esc(x.text)}</span></div>`;
      return `<div class="checkline"><span class="dot" style="background:var(--green)"></span><b>📝 Not:</b> ${esc(x.title)||"(başlıksız)"}</div>`;
    }).join("");
    return `<div class="card"><h3 style="margin-bottom:8px">${dayName(d)}, ${fmtDate(d)}</h3>${rows}</div>`;
  }).join("")||`<div class="empty"><div class="big">🗓️</div>Bu aralıkta kayıt bulunamadı.</div>`;

  R.innerHTML=`
    <div class="stats">
      <div class="stat"><div class="k">Toplam kayıtlı süre</div><div class="v">${fmtDur(totalMin)||"0dk"}</div></div>
      <div class="stat"><div class="k">Zaman kaydı</div><div class="v">${te.length}</div></div>
      <div class="stat"><div class="k">Toplantı</div><div class="v">${mt.length}</div></div>
      <div class="stat"><div class="k">Plansız iş</div><div class="v">${up.length}</div></div>
    </div>
    <div class="card"><h3>📊 Zaman dağılımı (${fmtDate(f)} – ${fmtDate(to)})</h3>${bars}</div>
    <h3 style="margin:22px 2px 4px">🗓️ Gün gün akış</h3>
    ${dayHtml}`;
}

$("#modalSave").onclick=()=>{
  if(!editing) return;
  const {type,id}=editing;
  const g=s=>{const el=document.getElementById(s);return el?el.value.trim():"";};
  if(type==="segment"){
    if(!g("f_activity")){ toast("Ne çalıştığınızı yazın"); return; }
    data.timeEntries.unshift({id:uid(),created:Date.now(),date:todayStr(),start:fmtClock(editing.start),end:fmtClock(editing.end),category:g("f_category"),activity:g("f_activity"),note:g("f_note")});
    timer.segmentStart=editing.end; saveTimerState();
    const wasEnd=editing.isEnd;
    save(); closeModal(); render(); updateTimerBar();
    if(wasEnd) finishWorkFinal(); else toast("Kaydedildi ✔ · yeni iş için sayaç sıfırlandı");
    return;
  }
  let coll,rec;
  if(type==="zaman"){
    if(!g("f_activity")){ toast("Aktivite girin"); return; }
    coll="timeEntries";
    rec={activity:g("f_activity"),date:g("f_date"),start:g("f_start"),end:g("f_end"),category:g("f_category"),note:g("f_note")};
  }else if(type==="toplanti"){
    if(!g("f_title")){ toast("Başlık girin"); return; }
    coll="meetings";
    const actLines=g("f_actions").split("\n").map(s=>s.trim()).filter(Boolean);
    const oldActs=id?(findRec(type,id).actions||[]):[];
    const actions=actLines.map(t=>{const old=oldActs.find(a=>a.text===t);return {text:t,done:old?old.done:false};});
    rec={title:g("f_title"),date:g("f_date"),time:g("f_time"),participants:g("f_participants"),purpose:g("f_purpose"),notes:g("f_notes"),actions};
  }else if(type==="plansiz"){
    if(!g("f_text")){ toast("İş girin"); return; }
    coll="unplanned";
    rec={text:g("f_text"),date:g("f_date"),status:g("f_status"),source:g("f_source"),note:g("f_note"),time:id?findRec(type,id).time:nowTime()};
  }else if(type==="not"){
    if(!g("f_title") && !g("f_body")){ toast("Başlık veya içerik girin"); return; }
    coll="notes";
    rec={title:g("f_title"),body:g("f_body"),date:g("f_date"),tags:g("f_tags")};
  }else if(type==="proje"){
    if(!g("f_name")){ toast("Proje adı girin"); return; }
    coll="projects";
    const phLines=g("f_phases").split("\n").map(s=>s.trim()).filter(Boolean);
    const oldPh=id?(findRec(type,id).phases||[]):[];
    const phases=phLines.map(t=>{const old=oldPh.find(a=>a.text===t);return {text:t,done:old?old.done:false};});
    rec={name:g("f_name"),desc:g("f_desc"),stage:g("f_stage"),priority:g("f_priority"),startDate:g("f_startDate"),dueDate:g("f_dueDate"),notes:g("f_notes"),phases};
  }else if(type==="fikir"){
    if(!g("f_title")){ toast("Fikir başlığı girin"); return; }
    coll="ideas";
    rec={title:g("f_title"),body:g("f_body"),status:g("f_status"),tags:g("f_tags"),date:id?findRec(type,id).date:todayStr()};
  }
  if(id){ const i=data[coll].findIndex(x=>x.id===id); data[coll][i]={...data[coll][i],...rec}; }
  else { rec.id=uid(); rec.created=Date.now(); data[coll].unshift(rec); }
  save(); closeModal(); render(); toast(id?"Güncellendi ✔":"Eklendi ✔");
};

  {id:"gunbatimi",name:"Günbatımı"},
];
function applyTheme(t){ if(!THEMES.some(x=>x.id===t)) t="aydinlik"; document.documentElement.setAttribute("data-theme",t); localStorage.setItem("istakibi_theme",t); }
$("#btnTheme").onclick=()=>{
  const cur=document.documentElement.getAttribute("data-theme");
  const i=THEMES.findIndex(x=>x.id===cur);
  const next=THEMES[(i+1)%THEMES.length];
  applyTheme(next.id); toast("🎨 Tema: "+next.name);
};
applyTheme(localStorage.getItem("istakibi_theme")||"aydinlik");

/* ============ BAŞLAT ============ */
(async()=>{ await tryReconnect(); render(); updateTimerBar(); if(timer.running) startTick(); })();
</script>
</body>
</html>
